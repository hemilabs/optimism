version: 2.1

# Setup Configuration for CircleCI Dynamic Configuration
# Uses a custom compute-changes job to detect changed paths with full shell
# flexibility, then merges continuation configs and continues the pipeline.
# See: https://circleci.com/docs/using-dynamic-configuration/

setup: true

parameters:
  default_docker_image:
    type: string
    default: cimg/base:2026.03
  # Pinned ci-base-clang image (cimg/base + clang/llvm-dev/libclang-dev) for Rust jobs.
  # Provenance is verified by .github/workflows/security.yml.
  rust_base_image:
    type: string
    default: us-docker.pkg.dev/oplabs-tools-artifacts/images/ci-base-clang@sha256:873a6709dd48d7706b0baee139300f18ab7babf4a66f982b2383fe51ce2e5489
  base_image:
    type: string
    default: default
  # The dispatch parameters are used to manually dispatch pipelines that normally only run post-merge on develop
  # from the CircleCI UI. Example configuration:
  #   when:
  #     or:
  #       - equal: [ "develop", <<pipeline.git.branch>> ]
  #       - equal: [ true, <<pipeline.parameters.main_dispatch>> ]
  # Add a new `*_dispatch` parameter for any pipeline you want manual dispatch for.
  main_dispatch:
    type: boolean
    default: true # default to running main in case the manual run cancelled an automatic run
  fault_proofs_dispatch:
    type: boolean
    default: false
  reproducibility_dispatch:
    type: boolean
    default: false
  diff_asterisc_bytecode_dispatch:
    type: boolean
    default: false
  kontrol_dispatch:
    type: boolean
    default: false
  cannon_full_test_dispatch:
    type: boolean
    default: false
  sdk_dispatch:
    type: boolean
    default: false
  docker_publish_dispatch:
    type: boolean
    default: false
  publish_contract_artifacts_dispatch:
    type: boolean
    default: false
  publish_contract_artifacts_ref:
    type: string
    default: ""
  stale_check_dispatch:
    type: boolean
    default: false
  contracts_coverage_dispatch:
    type: boolean
    default: false
  heavy_fuzz_dispatch:
    type: boolean
    default: false
  rust_ci_dispatch:
    type: boolean
    default: false
  rust_e2e_dispatch:
    type: boolean
    default: false
  rust_nightly_bump_dispatch:
    type: boolean
    default: false
  l2_fork_test_dispatch:
    type: boolean
    default: false
  github-event-type:
    type: string
    default: "__not_set__"
  github-event-action:
    type: string
    default: "__not_set__"
  github-event-base64:
    type: string
    default: "__not_set__"
  devnet-metrics-collect:
    type: boolean
    default: false
  # go-cache-version can be used as a cache buster when making breaking changes to caching strategy
  go-cache-version:
    type: string
    default: "v0.1"

orbs:
  continuation: circleci/continuation@2.0.1
  utils: ethereum-optimism/circleci-utils@1.0.30

jobs:
  # --------------------------------------------------------------------------
  # This job prepares the dynamic continuation pipeline in 7 steps:
  #
  #   1. Install the mise toolset (front-loads the shared mise cache; provides
  #      yq for merging configs)
  #   2. Store string pipeline params  → /tmp/pipeline-parameters.json
  #   3. Store boolean pipeline params → /tmp/pipeline-parameters.json
  #   4. Detect file-tree changes     → /tmp/pipeline-parameters.json
  #   5. Routing policy (compute-workflow-conditions.sh): read the JSON, enable
  #      c-run_* workflow flags, strip intermediate params, write final JSON
  #   6. Merge continuation YAML configs → /tmp/merged-config.yml
  #   7. Call CircleCI continuation API with merged config + JSON params
  #
  # The routing data (schedules, dispatch flags, change patterns, passthrough
  # params) is declarative in routing.yml; the scripts only hold the logic.
  # The result: only workflows whose c-run_* flag is true will execute.
  # --------------------------------------------------------------------------
  prepare-continuation-config:
    docker:
      - image: << pipeline.parameters.default_docker_image >>
    environment:
      BASE_REVISION: develop
    steps:
      - checkout
      # Front-loads the mise toolset for the whole pipeline: this job always
      # completes before the continuation pipeline exists, so on a cold cache
      # (mise.toml change or eviction) it is the only job that cold-installs —
      # every continuation job restores the cache saved here. During an
      # upstream outage (GitHub rate limits, missing release attestations) the
      # blast radius is this one job instead of every job on every PR.
      # Also provides yq (pinned in mise.toml) for the merge/routing scripts.
      #
      # This must remain a full, unfiltered `mise install`: the orb saves
      # /data/mise-data under a write-once key, so narrowing the install here
      # (e.g. to just yq) would freeze an incomplete toolset for every
      # continuation job and silently force them all to cold-install forever.
      - utils/install-mise:
          enable_mise_cache: true
      # mise shims re-resolve the tool on every invocation, which the yq/jq
      # loops in the routing scripts below pay hundreds of times (~9s of
      # overhead measured). Putting the resolved tool bin directories ahead
      # of the shims makes those calls direct.
      - run:
          name: Put mise tool bin paths on PATH
          command: |
            echo "export PATH=\"$(mise bin-paths | paste -sd: -):\$PATH\"" >> "$BASH_ENV"
      # Validates the decision tree logic against known scenarios.
      # Fails fast if a refactor breaks expected workflow activation.
      - run:
          name: Test decision tree
          command: .circleci/scripts/test-decision-tree.sh
      # Forward string pipeline parameters to /tmp/pipeline-parameters.json.
      # collect-params.sh picks up all env vars starting with "c-" and writes them as JSON strings.
      # Add a line here when a new string value needs to reach continuation config jobs
      # (e.g., a new docker image, event payload, or cache version).
      - run:
          name: Store string pipeline parameters in JSON file
          command: .circleci/scripts/collect-params.sh str
          environment:
            c-default_docker_image: << pipeline.parameters.default_docker_image >>
            c-rust_base_image: << pipeline.parameters.rust_base_image >>
            c-base_image: << pipeline.parameters.base_image >>
            c-github-event-type: << pipeline.parameters.github-event-type >>
            c-github-event-action: << pipeline.parameters.github-event-action >>
            c-github-event-base64: << pipeline.parameters.github-event-base64 >>
            c-go-cache-version: << pipeline.parameters.go-cache-version >>
            c-publish_contract_artifacts_ref: << pipeline.parameters.publish_contract_artifacts_ref >>
      # Same as above but for booleans. Separate step because CircleCI renders
      # boolean pipeline params as 0/1 in environment blocks — the "bool" mode
      # normalizes them to JSON true/false.
      # These dispatch flags are consumed only by the routing policy
      # (compute-workflow-conditions.sh); they do NOT reach continuation configs.
      - run:
          name: Store boolean pipeline parameters in JSON file
          command: .circleci/scripts/collect-params.sh bool
          environment:
            c-main_dispatch: << pipeline.parameters.main_dispatch >>
            c-fault_proofs_dispatch: << pipeline.parameters.fault_proofs_dispatch >>
            c-reproducibility_dispatch: << pipeline.parameters.reproducibility_dispatch >>
            c-kontrol_dispatch: << pipeline.parameters.kontrol_dispatch >>
            c-cannon_full_test_dispatch: << pipeline.parameters.cannon_full_test_dispatch >>
            c-sdk_dispatch: << pipeline.parameters.sdk_dispatch >>
            c-publish_contract_artifacts_dispatch: << pipeline.parameters.publish_contract_artifacts_dispatch >>
            c-stale_check_dispatch: << pipeline.parameters.stale_check_dispatch >>
            c-contracts_coverage_dispatch: << pipeline.parameters.contracts_coverage_dispatch >>
            c-heavy_fuzz_dispatch: << pipeline.parameters.heavy_fuzz_dispatch >>
            c-rust_ci_dispatch: << pipeline.parameters.rust_ci_dispatch >>
            c-rust_e2e_dispatch: << pipeline.parameters.rust_e2e_dispatch >>
            c-rust_nightly_bump_dispatch: << pipeline.parameters.rust_nightly_bump_dispatch >>
            c-l2_fork_test_dispatch: << pipeline.parameters.l2_fork_test_dispatch >>
      # Change-detection patterns live in routing.yml (change_patterns.any and
      # change_patterns.all). Each is a POSIX ERE matched line-by-line against
      # `git diff --name-only origin/develop...HEAD`; collect-params.sh writes
      # the resulting c-<name> boolean into the JSON.
      #
      # Test a pattern locally:
      #   git diff --name-only origin/develop...HEAD | grep -E "^your/pattern/"
      - run:
          name: Detect file tree changes and store in JSON file
          command: .circleci/scripts/collect-params.sh detect
      - run:
          name: Detect docs-only changes (all-match)
          command: .circleci/scripts/collect-params.sh detect_all
      # Routing policy: enables the c-run_* workflow flags based on trigger,
      # branch, schedule, and the detected params. The workflow lists are data
      # in routing.yml; the conditions live in compute-workflow-conditions.sh.
      # Each c-run_<name> maps 1:1 to "when: << pipeline.parameters.c-run_<name> >>"
      # in a continuation config under .circleci/continue/.
      - run:
          name: Compute workflow conditions from pipeline parameters and store in JSON file
          environment:
            BRANCH: << pipeline.git.branch >>
            TRIGGER_SOURCE: << pipeline.trigger_source >>
            TAG: << pipeline.git.tag >>
            SCHEDULE_NAME: << pipeline.schedule.name >>
          command: .circleci/scripts/compute-workflow-conditions.sh
      # Deep-merges the 3 continuation YAML configs (main, rust-ci, rust-e2e)
      # into /tmp/merged-config.yml using yq. Later files win on key conflicts.
      # explode(.) resolves YAML anchors/aliases so the output is self-contained.
      - run:
          name: Merge continuation configs
          command: .circleci/scripts/merge-configs.sh
      - run:
          name: Test continuation parameter compatibility
          command: .circleci/scripts/test-continuation-params.sh
      # Calls the CircleCI continuation API with the merged config + JSON params.
      # This triggers the actual CI pipeline where only workflows with their
      # c-run_* flag set to true will execute.
      - continuation/continue:
          configuration_path: /tmp/merged-config.yml
          parameters: /tmp/pipeline-parameters.json

workflows:
  # Nightly Kurtosis acceptance tests
  scheduled-kurtosis-acceptance-tests:
    when:
      or:
        - equal: [build_daily, <<pipeline.schedule.name>>]
        - and:
            - equal:
                [
                  true,
                  << pipeline.parameters.kurtosis_acceptance_tests_dispatch >>,
                ]
            - equal: ["api", << pipeline.trigger_source >>]
    jobs:
      - prepare-continuation-config:
          # MISE_GITHUB_TOKEN: authenticated GitHub API quota for mise's tool
          # downloads (5,000 req/h per token vs 60/h/IP anonymous).
          context:
            - circleci-repo-readonly-authenticated-github-token

  setup-tag:
    when:
      or:
        - equal: ["webhook", << pipeline.trigger_source >>]
        - and:
            - equal: [true, <<pipeline.parameters.main_dispatch>>]
            - equal: ["api", << pipeline.trigger_source >>]
            - equal: [
                  << pipeline.parameters.github-event-type >>,
                  "__not_set__",
                ] #this is to prevent triggering this workflow as the default value is always set for main_dispatch
    jobs:
      - prepare-continuation-config:
          # MISE_GITHUB_TOKEN, as in the setup workflow above.
          context:
            - circleci-repo-readonly-authenticated-github-token
          filters:
            tags:
              only: /^op-deployer.*/
            branches:
              ignore: /.*/
          build_args: --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
      - go-release:
          filters:
            tags:
              only: /^op-deployer.*/
            branches:
              ignore: /.*/
          module: op-deployer
          context:
            - oplabs-gcr-release
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - build-contracts-go-release-op-deployer

  go-release-op-up:
    jobs:
      - contracts-bedrock-build:
          name: build-contracts-go-release-op-up
          filters:
            tags:
              only: /^op-up.*/
            branches:
              ignore: /.*/
          build_args: --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
      - go-release:
          filters:
            tags:
              only: /^op-up.*/
            branches:
              ignore: /.*/
          module: op-up
          context:
            - oplabs-gcr-release
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - build-contracts-go-release-op-up

  release:
    when:
      not:
        equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - initialize:
          context:
            - circleci-repo-readonly-authenticated-github-token
          filters:
            tags:
              only: /^(da-server|cannon|ufm-[a-z0-9\-]*|op-[a-z0-9\-]*)\/v.*/
            branches:
              ignore: /.*/
      - contracts-bedrock-build:
          context:
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - initialize
          filters:
            tags:
              only: /^op-deployer.*/ # ensure contract artifacts are embedded in op-deployer binary
            branches:
              ignore: /.*/
      # Standard (medium) cross-platform docker images go here
      - docker-build:
          matrix:
            parameters:
              docker_name:
                - op-node
                - op-batcher
                - op-deployer
                - op-faucet
                - op-proposer
                - op-challenger
                - op-dispute-mon
                - op-conductor
                - da-server
                - op-ufm
                - op-supervisor
                - op-supernode
                - op-test-sequencer
                - cannon
                - op-dripper
                - op-interop-mon
          name: <<matrix.docker_name>>-docker-release
          docker_tags: <<pipeline.git.revision>>
          platforms: "linux/amd64,linux/arm64"
          publish: true
          release: true
          filters:
            tags:
              only: /^<<matrix.docker_name>>\/v.*/
            branches:
              ignore: /.*/
          context:
            - oplabs-gcr-release
          requires:
            - initialize
            - contracts-bedrock-build
      # Checks for cross-platform images go here
      - check-cross-platform:
          matrix:
            parameters:
              op_component:
                - op-node
                - op-batcher
                - op-deployer
                - op-faucet
                - op-proposer
                - op-challenger
                - op-dispute-mon
                - op-conductor
                - da-server
                - op-ufm
                - op-supervisor
                - op-supernode
                - op-test-sequencer
                - op-deployer
                - cannon
                - op-dripper
                - op-interop-mon
          name: <<matrix.op_component>>-cross-platform
          requires:
            - op-node-docker-release
            - op-batcher-docker-release
            - op-deployer-docker-release
            - op-faucet-docker-release
            - op-proposer-docker-release
            - op-challenger-docker-release
            - op-dispute-mon-docker-release
            - op-conductor-docker-release
            - da-server-docker-release
            - op-ufm-docker-release
            - op-supervisor-docker-release
            - op-supernode-docker-release
            - op-test-sequencer-docker-release
            - cannon-docker-release
            - op-dripper-docker-release
            - op-interop-mon-docker-release
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-prestate:
          filters:
            tags:
              only: /^op-program\/v.*/
            branches:
              ignore: /.*/
          context:
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - initialize
      - publish-cannon-prestates:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
            - oplabs-network-optimism-io-bucket
          requires:
            - cannon-prestate
          filters:
            tags:
              only: /^op-program\/v.*/
            branches:
              ignore: /.*/

  scheduled-todo-issues:
    when:
      equal: [build_four_hours, <<pipeline.schedule.name>>]
    jobs:
      - todo-issues:
          name: todo-issue-checks
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token

  develop-publish-contract-artifacts:
    when:
      or:
        - and:
            - equal: ["develop", <<pipeline.git.branch>>]
            - equal: ["webhook", << pipeline.trigger_source >>]
        - and:
            - equal:
                [
                  true,
                  <<pipeline.parameters.publish_contract_artifacts_dispatch>>,
                ]
            - equal: ["api", << pipeline.trigger_source >>]
    jobs:
      - publish-contract-artifacts:
          context:
            - circleci-repo-readonly-authenticated-github-token

  develop-fault-proofs:
    when:
      or:
        - and:
            - equal: ["develop", <<pipeline.git.branch>>]
            - equal: ["webhook", << pipeline.trigger_source >>]
        - and:
            - equal: [true, <<pipeline.parameters.fault_proofs_dispatch>>]
            - equal: ["api", << pipeline.trigger_source >>]
    jobs:
      - cannon-prestate:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-stf-verify:
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token
      - contracts-bedrock-build:
          build_args: --deny-warnings --skip test
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token
      - go-tests-with-fault-proof-deps:
          name: op-e2e-cannon-tests
          notify: true
          mentions: "@proofs-team"
          no_output_timeout: 90m
          test_timeout: 480m
          resource_class: xlarge
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - contracts-bedrock-build
            - cannon-prestate
      - publish-cannon-prestates:
          context:
            - slack
            - oplabs-network-optimism-io-bucket
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - cannon-prestate
            - op-e2e-cannon-tests

  develop-kontrol-tests:
    when:
      or:
        - and:
            - equal: ["develop", <<pipeline.git.branch>>]
            - equal: ["webhook", << pipeline.trigger_source >>]
        - and:
            - equal: [true, <<pipeline.parameters.kontrol_dispatch>>]
            - equal: ["api", << pipeline.trigger_source >>]
    jobs:
      - kontrol-tests:
          context:
            - slack
            - runtimeverification
            - circleci-repo-readonly-authenticated-github-token

  scheduled-cannon-full-tests:
    when:
      or:
        - equal: [build_four_hours, <<pipeline.schedule.name>>]
        - equal: [true, << pipeline.parameters.cannon_full_test_dispatch >>]
    jobs:
      - contracts-bedrock-build:
          build_args: --deny-warnings --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-go-lint-and-test:
          requires:
            - contracts-bedrock-build
          skip_slow_tests: false
          no_output_timeout: 30m
          notify: true
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token

  scheduled-docker-publish:
    when:
      or:
        - equal: [build_daily, <<pipeline.schedule.name>>]
        # Trigger on manual triggers if explicitly requested
        - equal: [true, << pipeline.parameters.docker_publish_dispatch >>]
    jobs:
      - contracts-bedrock-build:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - docker-build:
          matrix:
            parameters:
              docker_name:
                - op-node
                - op-batcher
                - op-deployer
                - op-faucet
                - op-program
                - op-proposer
                - op-challenger
                - op-dispute-mon
                - op-conductor
                - op-supervisor
                - op-supernode
                - op-test-sequencer
                - cannon
                - op-dripper
                - op-interop-mon
          name: <<matrix.docker_name>>-docker-publish
          docker_tags: <<pipeline.git.revision>>,<<pipeline.git.branch>>
          platforms: "linux/amd64,linux/arm64"
          publish: true
          context:
            - oplabs-gcr
            - slack
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - contracts-bedrock-build
      - check-cross-platform:
          matrix:
            parameters:
              op_component:
                - op-node
                - op-batcher
                - op-deployer
                - op-faucet
                - op-program
                - op-proposer
                - op-challenger
                - op-dispute-mon
                - op-conductor
                - op-supervisor
                - op-supernode
                - op-test-sequencer
                - cannon
                - op-dripper
                - op-interop-mon
          name: <<matrix.op_component>>-cross-platform
          requires:
            - <<matrix.op_component>>-docker-publish
          context:
            - circleci-repo-readonly-authenticated-github-token

  scheduled-flake-shake:
    when:
      or:
        - equal: [build_daily, << pipeline.schedule.name >>]
        - and:
            - equal: [true, << pipeline.parameters.flake-shake-dispatch >>]
            - equal: ["api", << pipeline.trigger_source >>]
    jobs:
      - contracts-bedrock-build:
          build_args: --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-prestate-quick:
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-binary-build:
          name: rust-build-kona
          directory: kona
          binaries: "kona-node kona-supervisor"
          build_command: cargo build --release --bin kona-node --bin kona-supervisor
          needs_clang: true
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-binary-build:
          name: rust-build-op-rbuilder
          directory: op-rbuilder
          binaries: "op-rbuilder"
          build_command: cargo build --release -p op-rbuilder --bin op-rbuilder
          needs_clang: true
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-binary-build:
          name: rust-build-rollup-boost
          directory: rollup-boost
          binaries: "rollup-boost"
          build_command: cargo build --release -p rollup-boost --bin rollup-boost
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-binaries-for-sysgo:
          requires:
            - rust-build-kona
            - rust-build-op-rbuilder
            - rust-build-rollup-boost
      - op-acceptance-tests-flake-shake:
          context:
            - circleci-repo-readonly-authenticated-github-token
          requires:
            - contracts-bedrock-build
            - cannon-prestate-quick
            - rust-binaries-for-sysgo
      - op-acceptance-tests-flake-shake-report:
          requires:
            - op-acceptance-tests-flake-shake
      - op-acceptance-tests-flake-shake-promote:
          requires:
            - op-acceptance-tests-flake-shake-report
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-optimism
            - circleci-api-token
            - slack

  scheduled-preimage-reproducibility:
    when:
      or:
        - equal: [build_daily, <<pipeline.schedule.name>>]
        # Trigger on manual triggers if explicitly requested
        - equal: [true, << pipeline.parameters.reproducibility_dispatch >>]
    jobs:
      - preimage-reproducibility:
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token

  scheduled-stale-check:
    when:
      or:
        - equal: [build_daily, <<pipeline.schedule.name>>]
          # Trigger on manual triggers if explicitly requested
        - equal: [true, << pipeline.parameters.stale_check_dispatch >>]
    jobs:
      - stale-check:
          context:
            - circleci-repo-optimism

  scheduled-sync-test-op-node:
    when:
      or:
        - equal: [build_daily, <<pipeline.schedule.name>>]
        # Trigger on manual triggers if explicitly requested
        - equal: [true, << pipeline.parameters.sync_test_op_node_dispatch >>]
    jobs:
      - contracts-bedrock-build: # needed for sysgo tests
          build_args: --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-prestate-quick: # needed for sysgo tests
          context:
            - circleci-repo-readonly-authenticated-github-token
      - op-acceptance-sync-tests-docker:
          name: "sync-test-<<matrix.network_preset>>-daily-<<matrix.l2_cl_syncmode>>"
          gate: sync-test-op-node
          no_output_timeout: 30m
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
          requires:
            - contracts-bedrock-build
            - cannon-prestate-quick
          matrix:
            parameters:
              network_preset:
                [
                  "op-sepolia",
                  "base-sepolia",
                  "unichain-sepolia",
                  "op-mainnet",
                  "base-mainnet",
                ]
              l2_cl_syncmode: ["consensus-layer", "execution-layer"]

  scheduled-heavy-fuzz-tests:
    when:
      or:
        - equal: [build_daily, <<pipeline.schedule.name>>]
        - equal: [true, << pipeline.parameters.heavy_fuzz_dispatch >>]
    jobs:
      - contracts-bedrock-heavy-fuzz-nightly:
          context:
            - slack
            - circleci-repo-readonly-authenticated-github-token

  # Acceptance tests
  acceptance-tests:
    when:
      or:
        - equal: ["webhook", << pipeline.trigger_source >>]
        # Manual dispatch
        - and:
            - equal: [true, <<pipeline.parameters.acceptance_tests_dispatch>>]
            - equal: ["api", << pipeline.trigger_source >>]
    jobs:
      - contracts-bedrock-build: # needed for sysgo tests
          build_args: --skip test
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-prestate-quick: # needed for sysgo tests
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-kona-prestate: # needed for sysgo tests (if any package is in-memory)
          context:
            - circleci-repo-readonly-authenticated-github-token
      - cannon-kona-host: # needed for sysgo tests (if any package is in-memory)
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-binary-build:
          name: rust-build-kona
          directory: kona
          binaries: "kona-node kona-supervisor"
          build_command: cargo build --release --bin kona-node --bin kona-supervisor
          needs_clang: true
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-binary-build:
          name: rust-build-op-rbuilder
          directory: op-rbuilder
          binaries: "op-rbuilder"
          build_command: cargo build --release -p op-rbuilder --bin op-rbuilder
          needs_clang: true
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-binary-build:
          name: rust-build-rollup-boost
          directory: rollup-boost
          binaries: "rollup-boost"
          build_command: cargo build --release -p rollup-boost --bin rollup-boost
          context:
            - circleci-repo-readonly-authenticated-github-token
      - rust-binaries-for-sysgo:
          requires:
            - rust-build-kona
            - rust-build-op-rbuilder
            - rust-build-rollup-boost
      # IN-MEMORY (all)
      - op-acceptance-tests:
          name: memory-all
          gate: "" # Empty gate = gateless mode
          no_output_timeout: 120m # Allow longer runs for memory-all gate
          context:
            - circleci-repo-readonly-authenticated-github-token
            - slack
            - discord
          requires:
            - contracts-bedrock-build
            - cannon-prestate-quick
            - cannon-kona-prestate
            - cannon-kona-host
            - rust-binaries-for-sysgo
      # Generate flaky test report
      - generate-flaky-report:
          name: generate-flaky-tests-report
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-api-token

  close-issue-workflow:
    when:
      and:
        - equal: [<< pipeline.trigger_source >>, "api"]
        - equal: [<< pipeline.parameters.github-event-type >>, "pull_request"]
        - equal: [<< pipeline.parameters.github-event-action >>, "labeled"]
    jobs:
      - close-issue:
          label_name: "auto-close-trivial-contribution"
          message: "Thank you for your interest in contributing!
            At this time, we are not accepting contributions that primarily fix spelling, stylistic, or grammatical errors in documentation, code, or elsewhere.
            Please check our [contribution guidelines](https://github.com/ethereum-optimism/optimism/blob/develop/CONTRIBUTING.md#contributions-related-to-spelling-and-grammar) for more information.
            This issue will be closed now."
          context:
            - circleci-repo-optimism

  devnet-metrics-collect:
    when:
      or:
        - equal: [<< pipeline.trigger_source >>, "webhook"]
        - and:
            - equal: [true, << pipeline.parameters.devnet-metrics-collect >>]
            - equal: [<< pipeline.trigger_source >>, "api"]
    jobs:
      - devnet-metrics-collect-authorship:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - oplabs-tools-data-public-metrics-bucket

  ai-contracts-test-workflow:
    when:
      or:
        - equal: [build_mon_thu, <<pipeline.schedule.name>>]
        - equal: [true, << pipeline.parameters.ai_contracts_test_dispatch >>]
    jobs:
      - ai-contracts-test:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-api-token
            - devin-api
            - slack
